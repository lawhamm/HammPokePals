plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hammpokepals.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hammpokepals.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No third-party dependencies — a plain WebView wrapper keeps the build simple
// and fast (just the Android framework's android.webkit.WebView).
dependencies {
}
